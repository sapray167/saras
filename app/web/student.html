<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SARAS - Student Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif'],mono:['JetBrains Mono','ui-monospace','monospace']}}}}</script>
<style>
:root{--bg:#09090B;--card:rgba(24,24,27,.72);--solid:#141417;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);--text:#e4e4e7;--muted:#a1a1aa;--faint:#71717a;--accent:#34d399;--accent2:#22d3ee;--warn:#fbbf24;--bad:#f87171;--chip:rgba(255,255,255,.05);--grid:rgba(255,255,255,.08);--glow:rgba(52,211,153,.14);--badbg:rgba(248,113,113,.12);--goodbg:rgba(52,211,153,.12)}
html.light{--bg:#f4f5f7;--card:rgba(255,255,255,.9);--solid:#ffffff;--border:rgba(15,23,42,.1);--border2:rgba(15,23,42,.2);--text:#18181b;--muted:#52525b;--faint:#71717a;--accent:#059669;--accent2:#0e7490;--warn:#b45309;--bad:#dc2626;--chip:rgba(15,23,42,.05);--grid:rgba(15,23,42,.1);--glow:rgba(5,150,105,.1);--badbg:rgba(220,38,38,.09);--goodbg:rgba(5,150,105,.1)}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;padding-bottom:64px;background-image:radial-gradient(900px 380px at 12% -8%,var(--glow),transparent 60%)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.ctitle{font-size:13px;font-weight:600;color:var(--text);letter-spacing:.01em}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.chip{background:var(--chip);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:11px;color:var(--muted);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--border2);color:var(--text)}.chip.on{color:var(--text);border-color:var(--accent);background:var(--goodbg)}
.pill{margin-left:6px;font-size:11px;font-weight:600;border-radius:8px;padding:4px 9px;white-space:nowrap;border:1px solid}
.pill.safe{color:var(--accent);background:var(--goodbg);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pill.need{color:var(--bad);background:var(--badbg);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.pill.new{color:var(--muted);background:var(--chip);border-color:var(--border)}
.btn{background:var(--chip);border:1px solid var(--border2);border-radius:10px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.primary{background:var(--accent);color:#04130d;border-color:var(--accent)}.btn.primary:hover{filter:brightness(1.08);color:#04130d}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{background:var(--chip);border:1px solid var(--border);color:var(--text);border-radius:10px;outline:none;font-size:13px}
select option{background:var(--solid);color:var(--text)}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.avatar{border-radius:999px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.tt-col{position:relative;border-left:1px dashed var(--grid)}
.block{position:absolute;left:3px;right:3px;border-radius:9px;padding:5px 7px;overflow:hidden;cursor:pointer;border:1px solid;border-left-width:3px;transition:transform .12s,filter .12s;font-size:11px;line-height:1.25}
.block:hover{transform:scale(1.02);filter:brightness(1.15);z-index:5}
.block.clash{outline:2px dashed var(--bad);outline-offset:1px}
.block.dim{opacity:.18}
.row-open{background:var(--chip)}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);background:var(--solid);border:1px solid var(--border2);padding:9px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--solid);border:1px solid var(--border2);border-radius:18px;width:100%;max-width:640px;max-height:86vh;display:flex;flex-direction:column}
.switch{width:44px;height:24px;border-radius:99px;background:var(--chip);border:1px solid var(--border2);position:relative;cursor:pointer;transition:.2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:99px;background:var(--text);transition:.2s}
html.light .switch::after{left:22px}
.skeleton{background:linear-gradient(90deg,var(--chip),var(--border),var(--chip));background-size:200% 100%;animation:sk 1.3s infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="sticky top-0 z-40 border-b" style="background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-color:var(--border)">
  <div class="max-w-[1400px] mx-auto px-4 py-3 flex items-center gap-3 sm:gap-6">
    <a href="/" class="flex items-center gap-2 shrink-0" aria-label="SARAS home">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><path d="M22 8.5c-1.6-1.8-3.8-2.7-6.4-2.7-3.6 0-6 1.8-6 4.5 0 6.1 12.8 3.2 12.8 9.8 0 3.1-2.9 5.1-6.7 5.1-3 0-5.5-1.1-7.2-3.1" fill="none" stroke="url(#lg)" stroke-width="3.4" stroke-linecap="round"/></svg>
      <span class="font-semibold tracking-[.32em] text-lg">SARAS</span>
    </a>
    <label class="relative flex-1 max-w-xl">
      <span class="sr-only">Search courses</span>
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 faint" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search courses, professors...  ( / )" class="w-full pl-9 pr-3 py-2" autocomplete="off">
    </label>
    <div class="hidden sm:block ml-auto">
      <div class="text-[10px] faint leading-none mb-0.5">Semester Selector</div>
      <select id="semSel" class="px-3 py-1.5 text-sm font-medium" aria-label="Semester"></select>
    </div>
    <div class="relative">
      <button id="profileBtn" class="flex items-center gap-2 chip" style="padding:5px 12px 5px 5px;font-size:13px;color:var(--text)" aria-haspopup="true">
        <span id="pAvatar" class="avatar" style="width:28px;height:28px;font-size:11px">--</span>
        <span id="pName" class="hidden sm:inline">Loading...</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div id="profileMenu" class="card hidden absolute right-0 mt-2 w-52 p-1.5 z-50" style="background:var(--solid)">
        <button class="w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-[var(--chip)]" id="menuReg">Register / drop courses</button>
        <button class="w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-[var(--chip)]" id="menuLogout">Sign out</button>
      </div>
    </div>
  </div>
  <div class="sm:hidden px-4 pb-2"><select id="semSelM" class="w-full px-3 py-1.5 text-sm" aria-label="Semester"></select></div>
</header>

<main class="max-w-[1400px] mx-auto px-4 py-5 space-y-4">
  <section id="kpis" class="grid grid-cols-2 lg:grid-cols-4 gap-4" aria-label="Key figures">
    <div class="card h-[132px] skeleton"></div><div class="card h-[132px] skeleton"></div><div class="card h-[132px] skeleton"></div><div class="card h-[132px] skeleton"></div>
  </section>

  <section class="grid grid-cols-1 lg:grid-cols-12 gap-4">
    <div class="card lg:col-span-3 p-4 flex flex-col" style="min-height:520px">
      <div class="flex items-center justify-between mb-3">
        <h2 id="leftTitle" class="ctitle">Attendance Bunk-O-Meter</h2>
        <div class="flex items-center gap-2">
          <button id="riskChip" class="chip" aria-pressed="false" title="Show only courses below the minimum">At risk</button>
          <button id="collapseBtn" class="faint hover:text-[var(--text)]" aria-label="Collapse" aria-expanded="true"><svg id="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 15 6-6 6 6"/></svg></button>
        </div>
      </div>
      <div id="bunkBody" class="scroll flex-1 space-y-2 pr-1" style="max-height:440px"></div>
      <p id="bunkNote" class="text-[11px] faint mt-3"></p>
    </div>

    <div class="card lg:col-span-6 p-4" style="min-height:520px">
      <div class="flex items-center justify-between mb-3 gap-2">
        <h2 class="ctitle">My Weekly Timetable</h2>
        <div class="flex items-center gap-2">
          <button id="regBtn" class="btn" style="padding:4px 10px">+ Register</button>
          <select id="ttFilter" class="px-2 py-1 text-xs" aria-label="Timetable filter"><option value="all">All</option></select>
        </div>
      </div>
      <div id="timetable" class="scroll"></div>
    </div>

    <div class="lg:col-span-3 flex flex-col gap-4">
      <div class="card p-4">
        <div class="flex items-center justify-between mb-1"><h2 class="ctitle">Performance Sparkline</h2>
          <div class="flex gap-1.5"><button class="chip on" data-line="sgpa">SGPA</button><button class="chip on" data-line="cgpa">CGPA</button></div></div>
        <div class="text-[11px] faint mb-2">GPA trend line chart</div>
        <div id="trend" class="relative"></div>
      </div>
      <div id="clashCard" class="card p-4 flex-1"></div>
    </div>
  </section>
</main>

<footer class="fixed bottom-0 inset-x-0 z-30 border-t" style="background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-color:var(--border)">
  <div class="max-w-[1400px] mx-auto px-4 py-3 flex items-center justify-center gap-3 text-sm">
    <button id="themeSwitch" class="switch" role="switch" aria-checked="false" aria-label="Toggle light and dark theme"></button>
    <span id="themeLabel" class="muted">Dark theme - click to switch</span>
  </div>
</footer>

<div id="modal" class="modal-bg" role="dialog" aria-modal="true"><div class="modal" id="modalBox"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- common helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['Mon','Tue','Wed','Thu','Fri'];
const API=window.SARAS_DEMO_API||{
  async req(method,url,body){
    const r=await fetch(url,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
    if(r.status===401){location.href='/login';throw new Error('Signed out')}
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw Object.assign(new Error(j.error||r.statusText),{status:r.status,data:j});
    return j},
  get(u){return this.req('GET',u)},post(u,b){return this.req('POST',u,b||{})},del(u){return this.req('DELETE',u)}};
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const initials=n=>String(n).replace(/\./g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const avatar=(n,sz=30)=>`<span class="avatar" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.38)}px;background:hsl(${hue(n)} 50% 42%)">${esc(initials(n))}</span>`;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function setTheme(t){document.documentElement.classList.toggle('light',t==='light');document.documentElement.classList.toggle('dark',t!=='light');
  $('#themeSwitch').setAttribute('aria-checked',t==='light');$('#themeLabel').textContent=t==='light'?'Light theme - click to switch':'Dark theme - click to switch';store('saras-theme',t)}
function openModal(html){$('#modalBox').innerHTML=html;$('#modal').classList.add('open');const f=$('#modalBox [autofocus]');f&&f.focus()}
function closeModal(){$('#modal').classList.remove('open')}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- chart helpers (inline SVG) ---------- */
let uid=0;
function spark(vals,color='var(--accent)',w=200,h=44){
  if(!vals||vals.length<2)return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}"><line x1="0" y1="${h-6}" x2="${w}" y2="${h-6}" stroke="var(--grid)" stroke-dasharray="3 4"/></svg>`;
  const id='sg'+(++uid),mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*(w-4)+2,h-6-((v-mn)/r)*(h-14)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w-2} ${h} L2 ${h} Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`}
function gauge(val,max){
  const cx=70,cy=64,r=52,f=Math.max(0,Math.min(1,(val||0)/max)),th=Math.PI*(1-f);
  const pt=(a,rr=r)=>[cx+rr*Math.cos(a),cy-rr*Math.sin(a)];
  const [x1,y1]=pt(th),[nx,ny]=pt(th,r-12),id='gg'+(++uid);
  return `<svg viewBox="0 0 140 76" width="140" height="76" role="img" aria-label="CGPA ${val} of ${max}"><defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
  <path d="M${cx-r} ${cy} A${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="var(--grid)" stroke-width="9" stroke-linecap="round"/>
  ${f>0?`<path d="M${cx-r} ${cy} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="url(#${id})" stroke-width="9" stroke-linecap="round"/>`:''}
  <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="4.5" fill="var(--text)"/></svg>`}
function ring(p,color,size=84){
  const r=34,c=2*Math.PI*r,f=Math.max(0,Math.min(100,p||0))/100;
  return `<svg width="${size}" height="${size}" viewBox="0 0 84 84" role="img" aria-label="${p}%"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--grid)" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text)">${p==null?'--':Math.round(p)+'%'}</text></svg>`}

/* ---------- state ---------- */
const S={semesters:[],sem:null,data:null,q:'',risk:false,ttf:'all',open:null,skip:{},lines:{sgpa:true,cgpa:true},colors:{}};
const PALETTE=['#34d399','#60a5fa','#f472b6','#fbbf24','#a78bfa','#fb923c','#22d3ee','#f87171'];
const bunk=(a,t,min=75)=>{if(!t)return{status:'new',pct:null,safe:0,need:0};
  const pct=a/t*100;if(100*a>=min*t)return{status:'safe',pct,safe:Math.max(0,Math.floor((100*a-min*t)/min)),need:0};
  return{status:'need',pct,safe:0,need:Math.ceil((min*t-100*a)/(100-min))}};
const pillHtml=b=>{const sf=b.safe??b.safe_to_skip??0,nd=b.need??b.need_to_attend??0;return b.status==='safe'?`<span class="pill safe">Safe to skip: ${sf} class${sf===1?'':'es'}</span>`:b.status==='need'?`<span class="pill need">Need to attend next ${nd}</span>`:`<span class="pill new">No classes yet</span>`};
const matches=(o,q)=>!q||[o.code,o.name,o.professor].some(x=>String(x).toLowerCase().includes(q));

/* ---------- renderers ---------- */
function renderProfile(){const p=S.data.profile;$('#pName').textContent=`${p.name} - ${p.department}`;$('#pAvatar').textContent=initials(p.name);$('#pAvatar').style.background=`hsl(${hue(p.name)} 50% 42%)`}
function renderKpis(){
  const k=S.data.kpis,cur=S.data.semester.is_current,cr=Math.min(100,k.credits/k.max_credits*100);
  const card=(t,body)=>`<div class="card p-4 h-[132px] flex flex-col"><div class="text-[13px] muted font-medium">${t}</div>${body}</div>`;
  $('#kpis').innerHTML=
   card('1. Current CGPA: <b class="text-[var(--text)]">'+(k.cgpa==null?'--':k.cgpa.toFixed(2))+' / 10</b>',`<div class="flex-1 flex flex-col items-center justify-end gap-0.5 overflow-hidden">${gauge(k.cgpa,10)}<div class="w-full -mt-1">${spark(k.series.cgpa,'var(--accent)',200,26)}</div></div>`)+
   card('2. Overall Attendance: <b class="text-[var(--text)]">'+(k.attendance_pct==null?'--':Math.round(k.attendance_pct)+'%')+'</b>',`<div class="flex-1 grid place-items-center">${k.attendance_pct==null?'<span class="text-xs faint">Not tracked for past semesters</span>':ring(k.attendance_pct,k.attendance_pct<75?'var(--bad)':'var(--warn)',84)}</div>`)+
   card('Current Credits: <b class="text-[var(--text)]">'+k.credits+' / '+k.max_credits+'</b>',`<div class="flex-1 flex flex-col justify-center gap-2"><div class="h-2.5 rounded-full overflow-hidden" style="background:var(--grid)"><div style="width:${cr}%;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px"></div></div>${spark(k.series.credits,'var(--warn)',200,34)}</div>`)+
   card('Active Courses: <b class="text-[var(--text)]">'+k.active_courses+'</b>',`<div class="flex-1 flex flex-col justify-center gap-2"><div class="self-center card" style="padding:4px 18px;font-size:24px;font-weight:700;border-radius:10px">${k.active_courses}</div>${spark(k.series.courses,'var(--accent2)',200,26)}</div>`)}

function renderBunk(){
  const d=S.data,body=$('#bunkBody'),title=$('#leftTitle');
  if(!d.semester.is_current){
    title.textContent='Semester Results';$('#riskChip').classList.add('hidden');$('#bunkNote').textContent='Attendance is only tracked for the running semester.';
    body.innerHTML=d.results.length?d.results.filter(r=>matches(r,S.q)).map(r=>`<div class="flex items-center gap-3 p-2 rounded-xl" style="background:var(--chip)"><span class="avatar text-[11px]" style="width:34px;height:34px;background:hsl(${hue(r.code)} 50% 40%)">${esc(r.grade)}</span><div class="min-w-0 flex-1"><div class="text-sm font-semibold">${esc(r.code)}<span class="faint font-normal"> - ${r.total}/100</span></div><div class="text-[11px] muted truncate">${esc(r.name)}</div></div><span class="text-xs faint">${r.grade_point} GP</span></div>`).join('')||'<p class="text-sm faint">No matches.</p>':'<p class="text-sm faint">No published results for this semester.</p>';return}
  title.textContent='Attendance Bunk-O-Meter';$('#riskChip').classList.remove('hidden');
  const rows=d.bunk.filter(b=>matches(b,S.q)&&(!S.risk||b.status==='need'));
  $('#bunkNote').textContent=`Minimum required: ${d.min_attendance}%. Click a course to simulate skipping classes.`;
  if(!d.bunk.length){body.innerHTML='<p class="text-sm faint p-2">You are not registered for any course yet. Use "+ Register".</p>';return}
  body.innerHTML=rows.map(b=>{
    const n=S.skip[b.offering_id]||0,open=S.open===b.offering_id,sim=bunk(b.attended,b.total+n,d.min_attendance);
    return `<div class="rounded-xl ${open?'row-open':''}" style="border:1px solid ${open?'var(--border2)':'transparent'}">
      <button class="w-full flex items-center gap-2.5 p-2 text-left" data-open="${b.offering_id}" aria-expanded="${open}">
        ${avatar(b.professor,32)}
        <div class="min-w-0 flex-1"><div class="flex items-baseline gap-1.5 text-sm font-semibold">${esc(b.code)}<span class="text-xs font-medium" style="color:${b.status==='need'?'var(--bad)':'var(--muted)'}">${b.percent==null?'--':Math.round(b.percent)+'%'}</span></div><div class="text-[11px] muted truncate">${esc(b.name)}</div></div>
        ${pillHtml(b)}</button>
      ${open?`<div class="px-3 pb-3 text-xs space-y-2"><div class="faint">Attended ${b.attended} of ${b.total} classes - ${esc(b.professor)}</div>
        <div class="flex items-center gap-2"><span class="muted">If I skip the next</span><button class="btn" style="padding:1px 9px" data-step="-1:${b.offering_id}" aria-label="Fewer">-</button><b class="w-5 text-center" id="skipN">${n}</b><button class="btn" style="padding:1px 9px" data-step="1:${b.offering_id}" aria-label="More">+</button><span class="muted">classes</span></div>
        <div class="flex items-center gap-2 flex-wrap"><span>Projected:</span><b>${sim.pct==null?'--':sim.pct.toFixed(1)+'%'}</b>${pillHtml(sim)}</div></div>`:''}
    </div>`}).join('')||'<p class="text-sm faint p-2">No courses match.</p>'}

const toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
// Put overlapping blocks of one day side by side instead of on top of each other
function lanes(list){
  const bs=list.map(b=>({...b,s:toMin(b.start),e:toMin(b.end)})).sort((a,b)=>a.s-b.s||a.e-b.e),out=[];
  let grp=[],end=0;
  const flush=()=>{const n=Math.max(1,...grp.map(b=>b.lane+1));grp.forEach(b=>out.push({...b,lanes:n}));grp=[]};
  for(const b of bs){
    if(grp.length&&b.s>=end)flush();
    const used=new Set(grp.filter(g=>g.e>b.s).map(g=>g.lane));let l=0;while(used.has(l))l++;
    b.lane=l;grp.push(b);end=Math.max(end,b.e);
  }
  flush();return out}
function renderTimetable(){
  const d=S.data,blocks=d.timetable,H0=9,H1=17.5,PX=54,height=(H1-H0)*PX;
  [...new Set(blocks.map(b=>b.code))].forEach((c,i)=>S.colors[c]=PALETTE[i%PALETTE.length]);
  const sel=$('#ttFilter'),codes=[...new Set(blocks.map(b=>b.code))];
  sel.innerHTML=`<option value="all">All</option>${d.clashes.length?'<option value="clash">Clashes only</option>':''}`+codes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  if(![...sel.options].some(o=>o.value===S.ttf))S.ttf='all';sel.value=S.ttf;
  if(!blocks.length){$('#timetable').innerHTML='<p class="text-sm faint p-6 text-center">No timetable for this semester.</p>';return}
  const today=(new Date().getDay()+6)%7;
  const show=b=>S.ttf==='all'||(S.ttf==='clash'?b.clash:b.code===S.ttf);
  const hours=[];for(let h=H0;h<=H1;h++)hours.push(h);
  let cols='';
  for(let day=0;day<5;day++){
    cols+=`<div class="tt-col" style="height:${height}px;${day===today?'background:linear-gradient(var(--chip),transparent)':''}">`+lanes(blocks.filter(b=>b.day===day&&show(b))).map(b=>{
      const top=(toMin(b.start)/60-H0)*PX,h=(toMin(b.end)-toMin(b.start))/60*PX-2,c=S.colors[b.code],dim=S.q&&!matches(b,S.q);
      return `<button class="block ${b.clash?'clash':''} ${dim?'dim':''}" data-block="${b.offering_id}" style="top:${top}px;height:${h}px;left:calc(${b.lane}*100%/${b.lanes} + 3px);right:calc(${b.lanes-b.lane-1}*100%/${b.lanes} + 3px);background:color-mix(in srgb,${c} 18%,transparent);border-color:color-mix(in srgb,${c} 55%,transparent);border-left-color:${c};text-align:left" title="${esc(b.name)} - ${esc(b.professor)} (${b.start}-${b.end}, ${esc(b.room||'')})">
        <div class="font-semibold" style="color:${c}">${b.start}-${b.end}${b.clash?' &#9888;':''}</div><div class="font-medium" style="color:var(--text)">${esc(b.code)}</div><div class="muted truncate">${esc(b.name)}</div>${h>74?`<div class="faint truncate">${esc(b.professor)}</div>`:''}</button>`}).join('')+'</div>'}
  $('#timetable').innerHTML=`<div style="min-width:520px"><div class="grid" style="grid-template-columns:48px repeat(5,1fr)">
    <div></div>${DAYS.map((n,i)=>`<div class="text-center text-xs font-medium py-1.5 ${i===today?'':'muted'}" ${i===today?'style="color:var(--accent)"':''}>${n}</div>`).join('')}
    <div class="relative" style="height:${height}px">${hours.map(h=>`<div class="absolute right-2 text-[10px] faint" style="top:${(h-H0)*PX-6}px">${String(Math.floor(h)).padStart(2,'0')}:${h%1?'30':'00'}</div>`).join('')}</div>${cols}</div></div>`}

function renderTrend(){
  const t=S.data.gpa_trend,el=$('#trend');
  if(t.length<1){el.innerHTML='<p class="text-sm faint py-6">No completed semesters yet.</p>';return}
  const W=300,H=190,L=30,R=14,T=14,B=26,vals=t.flatMap(x=>[S.lines.sgpa?x.sgpa:null,S.lines.cgpa?x.cgpa:null]).filter(v=>v!=null);
  let mn=Math.floor(Math.min(...vals,10)-.01),mx=Math.min(10,Math.ceil(Math.max(...vals,0)+.2));if(mx-mn<1){mn=mx-1}
  const x=i=>L+(t.length===1?(W-L-R)/2:i/(t.length-1)*(W-L-R)),y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const line=(k,col,dash)=>S.lines[k]?`<path d="${t.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p[k]).toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.4" ${dash?'stroke-dasharray="5 4"':''} stroke-linecap="round" stroke-linejoin="round"/>`:'';
  const ticks=[];for(let v=mn;v<=mx+1e-9;v+=(mx-mn)>3?1:.5)ticks.push(v);
  const first9=t.findIndex(p=>p.sgpa>=9),best=t.reduce((b,p,i)=>p.sgpa>t[b].sgpa?i:b,0);
  const short=l=>l.replace('Fall ','F').replace('Spring ','S').replace(/20(\d\d)/,"'$1");
  const flag=(i,col,txt)=>`<g><line x1="${x(i)}" y1="${y(t[i].sgpa)}" x2="${x(i)}" y2="${T+2}" stroke="${col}" stroke-dasharray="2 3"/><path d="M${x(i)} ${T+2} h14 l-3 4 l3 4 h-14z" fill="${col}"><title>${esc(txt)}</title></path></g>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="GPA trend by semester">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-5}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="var(--faint)">${v.toFixed(1)}</text>`).join('')}
    ${line('cgpa','var(--accent2)',true)}${line('sgpa','var(--accent)',false)}
    ${first9>=0&&S.lines.sgpa?flag(first9,'var(--warn)','First 9.0+ SGPA'):''}${best!==first9&&S.lines.sgpa?flag(best,'var(--bad)','Best semester'):''}
    ${t.map((p,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--faint)">${esc(short(p.label))}</text>
      ${S.lines.sgpa?`<circle class="pt" data-i="${i}" cx="${x(i)}" cy="${y(p.sgpa)}" r="4.5" fill="var(--solid)" stroke="var(--accent)" stroke-width="2.2" style="cursor:pointer"/>`:''}
      ${S.lines.cgpa?`<circle class="pt" data-i="${i}" cx="${x(i)}" cy="${y(p.cgpa)}" r="3.5" fill="var(--solid)" stroke="var(--accent2)" stroke-width="2" style="cursor:pointer"/>`:''}`).join('')}</svg><div id="tip" class="card hidden absolute text-xs px-2.5 py-1.5 pointer-events-none" style="background:var(--solid)"></div>`;
  $$('.pt',el).forEach(c=>{c.addEventListener('mouseenter',()=>{const p=t[+c.dataset.i],tip=$('#tip');tip.innerHTML=`<b>${esc(p.label)}</b><br>SGPA ${p.sgpa.toFixed(2)} - CGPA ${p.cgpa.toFixed(2)}`;tip.classList.remove('hidden');
      const r=c.getBoundingClientRect(),b=el.getBoundingClientRect();tip.style.left=Math.max(0,Math.min(b.width-130,r.left-b.left-50))+'px';tip.style.top=(r.top-b.top-46)+'px'});
    c.addEventListener('mouseleave',()=>$('#tip').classList.add('hidden'))})}

function renderClash(){
  const cl=S.data.clashes,el=$('#clashCard');
  if(!cl.length){el.innerHTML=`<h2 class="ctitle mb-2" style="color:var(--accent)">No timetable clashes</h2><p class="text-xs muted">All your registered courses fit together this semester.</p>`;return}
  el.style.background='var(--badbg)';el.style.borderColor='color-mix(in srgb,var(--bad) 45%,transparent)';
  el.innerHTML=`<h2 class="ctitle mb-2 flex items-center gap-1.5" style="color:var(--bad)">&#9888; Timetable Clash Warning</h2>`+cl.map(c=>`<p class="text-xs mb-2"><b>${esc(c.a.code)}</b> and <b>${esc(c.b.code)}</b> overlap on ${DAYS[c.day]} ${c.start}-${c.end}.</p>`).join('')+
   `<div class="flex gap-2 mt-3"><button class="btn danger" id="clashFix">Resolve in Register</button><button class="btn" id="clashShow">Show in timetable</button></div>`;
  $('#clashFix').onclick=openRegister;$('#clashShow').onclick=()=>{S.ttf='clash';renderTimetable()}}

function renderAll(){renderProfile();renderKpis();renderBunk();renderTimetable();renderTrend();renderClash();if(!S.data.clashes.length){$('#clashCard').style.background='';$('#clashCard').style.borderColor=''}}

/* ---------- data ---------- */
async function load(){
  try{S.data=await API.get('/api/student/dashboard'+(S.sem?`?semester_id=${S.sem}`:''));
    S.sem=S.data.semester.id;renderAll()}catch(e){if(e.message!=='Signed out')toast('Could not load dashboard: '+e.message)}}
async function init(){
  setTheme(store('saras-theme')||'dark');
  try{S.semesters=await API.get('/api/semesters')}catch(e){}
  const cur=S.semesters.find(s=>s.is_current);S.sem=cur?cur.id:null;
  const opts=S.semesters.slice().reverse().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
  ['#semSel','#semSelM'].forEach(id=>{$(id).innerHTML=opts;$(id).value=S.sem;$(id).onchange=e=>{S.sem=+e.target.value;S.open=null;S.skip={};$('#semSel').value=$('#semSelM').value=S.sem;load()}});
  await load()}

/* ---------- registration + course detail ---------- */
async function openRegister(){
  let d;try{d=await API.get('/api/student/offerings')}catch(e){return toast(e.message)}
  const row=o=>{const slots=o.slots.map(s=>`${DAYS[s.day]} ${s.start}`).join(', ');
    let act;if(o.registered)act=`<button class="btn danger" data-drop="${o.enrollment_id}">Drop</button>`;
    else if(o.errors&&o.errors.length)act=`<span class="text-[11px]" style="color:var(--bad);max-width:170px;text-align:right">${esc(o.errors[0])}</span>`;
    else act=`<button class="btn primary" data-enroll="${o.offering_id}">Register</button>`;
    return `<div class="flex items-center gap-3 p-2.5 rounded-xl" style="background:var(--chip)"><div class="min-w-0 flex-1"><div class="text-sm font-semibold">${esc(o.code)} <span class="font-normal muted">${esc(o.name)}</span></div>
      <div class="text-[11px] faint truncate">${esc(o.professor)} - ${o.credits} cr - ${esc(slots)} - ${o.seats_left} seats left</div>
      ${o.warnings&&o.warnings.length&&!o.registered?`<div class="text-[11px]" style="color:var(--warn)">&#9888; ${esc(o.warnings[0])}</div>`:''}</div>${act}</div>`};
  openModal(`<div class="p-5 border-b" style="border-color:var(--border)"><div class="flex justify-between items-start"><div><h3 class="font-semibold">Course registration - ${esc(d.semester)}</h3><p class="text-xs muted mt-0.5">Credits: <b>${d.credits}/${d.max_credits}</b>. Clashes need your confirmation.</p></div><button class="btn" onclick="closeModal()">Close</button></div></div>
    <div class="p-4 scroll space-y-2">${d.offerings.map(row).join('')}</div>`);
  $$('#modalBox [data-enroll]').forEach(b=>b.onclick=()=>enroll(+b.dataset.enroll,false));
  $$('#modalBox [data-drop]').forEach(b=>b.onclick=async()=>{try{await API.del('/api/student/enroll/'+b.dataset.drop);toast('Course dropped');await load();openRegister()}catch(e){toast(e.message)}})}
async function enroll(id,allow){
  try{await API.post('/api/student/enroll',{offering_id:id,allow_clash:allow});toast('Registered successfully');await load();openRegister()}
  catch(e){if(e.data&&e.data.code==='clash'&&!allow){if(confirm(e.message+'\n\nRegister anyway?'))enroll(id,true)}else toast(e.message)}}
function openCourse(id){
  const b=S.data.timetable.filter(t=>t.offering_id===id),x=b[0],bk=S.data.bunk.find(r=>r.offering_id===id),rs=S.data.results.find(r=>r.offering_id===id);
  if(!x)return;
  openModal(`<div class="p-5 border-b flex justify-between gap-3" style="border-color:var(--border)"><div><h3 class="font-semibold">${esc(x.code)} - ${esc(x.name)}</h3><p class="text-xs muted mt-0.5">${esc(x.professor)} - ${x.credits} credits</p></div><button class="btn h-fit" onclick="closeModal()">Close</button></div>
   <div class="p-5 space-y-4 scroll text-sm"><div class="space-y-1">${b.map(s=>`<div class="muted">${DAYS[s.day]} ${s.start}-${s.end} - Room ${esc(s.room||'TBA')}${s.clash?' <b style="color:var(--bad)">(clash)</b>':''}</div>`).join('')}</div>
   ${bk?`<div class="flex items-center gap-2 flex-wrap">Attendance <b>${bk.percent==null?'--':bk.percent+'%'}</b> (${bk.attended}/${bk.total}) ${pillHtml(bk)}</div>`:''}
   ${rs?`<div class="muted">Provisional result: <b style="color:var(--text)">${rs.total}/100 (${esc(rs.grade)})</b></div>`:''}
   ${bk?`<div><label class="text-xs muted" for="fb">Send feedback to the professor</label><textarea id="fb" rows="3" maxlength="500" class="w-full mt-1 p-2" placeholder="Ask a question or share feedback..." autofocus></textarea><div class="flex justify-end mt-2"><button class="btn primary" id="fbSend">Send</button></div></div>`:''}</div>`);
  const send=$('#fbSend');if(send)send.onclick=async()=>{const m=$('#fb').value.trim();if(!m)return toast('Write a message first');
    try{await API.post(`/api/student/offerings/${id}/feedback`,{message:m});toast('Feedback sent to your professor');closeModal()}catch(e){toast(e.message)}}}

/* ---------- events ---------- */
$('#search').addEventListener('input',e=>{S.q=e.target.value.trim().toLowerCase();renderBunk();renderTimetable()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#search').focus()}});
$('#ttFilter').onchange=e=>{S.ttf=e.target.value;renderTimetable()};
$('#riskChip').onclick=e=>{S.risk=!S.risk;e.target.classList.toggle('on',S.risk);e.target.setAttribute('aria-pressed',S.risk);renderBunk()};
$('#collapseBtn').onclick=()=>{const b=$('#bunkBody'),h=b.classList.toggle('hidden');$('#chev').style.transform=h?'rotate(180deg)':'';$('#collapseBtn').setAttribute('aria-expanded',!h)};
$('#bunkBody').addEventListener('click',e=>{
  const st=e.target.closest('[data-step]');if(st){const[dv,id]=st.dataset.step.split(':').map(Number);S.skip[id]=Math.max(0,Math.min(20,(S.skip[id]||0)+dv));renderBunk();return}
  const o=e.target.closest('[data-open]');if(o){const id=+o.dataset.open;S.open=S.open===id?null:id;renderBunk()}});
$('#timetable').addEventListener('click',e=>{const b=e.target.closest('[data-block]');if(b)openCourse(+b.dataset.block)});
$$('[data-line]').forEach(c=>c.onclick=()=>{S.lines[c.dataset.line]=!S.lines[c.dataset.line];c.classList.toggle('on',S.lines[c.dataset.line]);if(!S.lines.sgpa&&!S.lines.cgpa){S.lines[c.dataset.line]=true;c.classList.add('on')}renderTrend()});
$('#regBtn').onclick=openRegister;$('#menuReg').onclick=()=>{$('#profileMenu').classList.add('hidden');openRegister()};
$('#profileBtn').onclick=e=>{e.stopPropagation();$('#profileMenu').classList.toggle('hidden')};document.addEventListener('click',()=>$('#profileMenu').classList.add('hidden'));
$('#menuLogout').onclick=async()=>{if(API.demo){location.href='index.html';return}await API.post('/api/logout');location.href='/login'};
$('#themeSwitch').onclick=()=>setTheme(document.documentElement.classList.contains('light')?'dark':'light');
init();
</script>
</body>
